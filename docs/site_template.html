<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentAudit: Context Is the Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: a research-note column, figures breaking slightly wider, tables as quiet ledgers. */
:root {
  --bg: #f7f8fa;
  --paper: #ffffff;
  --ink: #14171c;
  --ink-2: #4a5160;
  --rule: #dde1e8;
  --accent: #2a78d6;
  --accent-soft: #e8f0fb;
  --font-display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11141a; --paper: #171b22; --ink: #e9ecf1; --ink-2: #a9b1bf; --rule: #2a313c;
    --accent: #5b9bea; --accent-soft: #1b2a3f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11141a; --paper: #171b22; --ink: #e9ecf1; --ink-2: #a9b1bf; --rule: #2a313c;
  --accent: #5b9bea; --accent-soft: #1b2a3f; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.65 var(--font-body); }
main { max-width: 760px; margin: 0 auto; padding: 48px 20px 80px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; line-height: 1.2; }
h1 { font-size: 2.6rem; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; }
h3 { font-size: 1.25rem; font-weight: 500; color: var(--ink-2); margin: 0 0 16px; }
h2 { font-size: 1.6rem; font-weight: 600; margin: 56px 0 12px; padding-top: 18px; border-top: 1px solid var(--rule); }
h2 + h3, main > h3 + p { margin-top: 0; }
p, li { max-width: 66ch; }
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
em { color: var(--ink-2); }
hr { border: 0; border-top: 1px solid var(--rule); margin: 28px 0; }
strong { font-weight: 600; }
code { font: 0.88em var(--font-mono); background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }
pre { background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; overflow-x: auto; }
pre code { background: none; padding: 0; font-size: 0.85rem; }
.table-wrap { overflow-x: auto; margin: 18px 0 24px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 600; color: var(--ink-2); background: var(--accent-soft); }
tr:last-child td { border-bottom: 0; }
figure { margin: 22px -20px; }
figure.chart img { display: block; max-width: 100%; height: auto; margin: 0 auto; border-radius: 8px; background: #fcfcfb;
  border: 1px solid var(--rule); padding: 10px; }
figure.diagram { background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 12px; overflow-x: auto; }
figure.diagram pre { border: 0; background: none; margin: 0; }
@media (max-width: 800px) { figure { margin: 22px 0; } h1 { font-size: 2rem; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
{{BODY}}
</main>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
  try {
    var dark = document.documentElement.getAttribute("data-theme") === "dark" ||
      (!document.documentElement.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
    mermaid.initialize({ startOnLoad: true, theme: dark ? "dark" : "neutral", securityLevel: "strict",
      fontFamily: "IBM Plex Sans, system-ui, sans-serif" });
  } catch (e) { /* the diagram source stays readable as text */ }
</script>
</body>
</html>
