curacy and AUROC with 95% stratified bootstrap CIs; exact McNemar tests, Holm-corrected; Wilson CIs for rates; ECE for calibration.</text><text x="28" y="590" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6372" font-weight="400" text-anchor="start" xml:space="preserve">Filled dot = arm reported for that suite. OSS = ProtectAI and deepset DeBERTa injection classifiers and a keyword regex, thresholds tuned on dev.</text></svg>