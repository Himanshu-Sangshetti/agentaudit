<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 610" width="1500" height="610"><defs><marker id="a8a91a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a91a0"/></marker></defs><rect width="1500" height="610" fill="#ffffff"/><text x="28" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="22" fill="#1f2430" font-weight="700" text-anchor="start" xml:space="preserve">Evaluation design: what every number is measured on</text><text x="28" y="64" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13.5" fill="#5b6372" font-weight="400" text-anchor="start" xml:space="preserve">Each configuration was chosen on dev, frozen in a commit, then run once on test. Every arm sees the same rows.</text><rect x="28.0" y="86" width="274.4" height="40" rx="20" fill="#f6f7f9" stroke="#d9dde4" stroke-width="1"/><text x="165.2" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" fill="#1f2430" font-weight="600" text-anchor="middle" xml:space="preserve">1  Build suite from public data</text><path d="M304.4,106 L318.4,106" stroke="#8a91a0" stroke-width="1.4" marker-end="url(#a8a91a0)"/><rect x="320.4" y="86" width="274.4" height="40" rx="20" fill="#f6f7f9" stroke="#d9dde4" stroke-width="1"/><text x="457.59999999999997" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" fill="#1f2430" font-weight="600" text-anchor="middle" xml:space="preserve">2  Design on dev split</text><path d="M596.8,106 L610.8,106" stroke="#8a91a0" stroke-width="1.4" marker-end="url(#a8a91a0)"/><rect x="612.8" y="86" width="274.4" height="40" rx="20" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1"/><text x="750.0" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" fill="#2a78d6" font-weight="600" text-anchor="middle" xml:space="preserve">3  Freeze config (git commit)</text><path d="M889.1999999999999,106 L903.1999999999999,106" stroke="#8a91a0" stroke-width="1.4" marker-end="url(#a8a91a0)"/><rect x="905.1999999999999" y="86" width="274.4" height="40" rx="20" fill="#f6f7f9" stroke="#d9dde4" stroke-width="1"/><text x="1042.3999999999999" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" fill="#1f2430" font-weight="600" text-anchor="middle" xml:space="preserve">4  Run once on held-out test</text><path d="M1181.6,106 L1195.6,106" stroke="#8a91a0" stroke-width="1.4" marker-end="url(#a8a91a0)"/><rect x="1197.6" y="86" width="274.4" height="40" rx="20" fill="#f6f7f9" stroke="#d9dde4" stroke-width="1"/><text x="1334.8" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" fill="#1f2430" font-weight="600" text-anchor="middle" xml:space="preserve">5  Report from per-row records</text><text x="28" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#8a91a0" font-weight="700" text-anchor="start" xml:space="preserve">SUITE</text><text x="210" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#8a91a0" font-weight="700" text-anchor="start" xml:space="preserve">ATTACK / BAD ROWS</text><text x="520" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#8a91a0" font-weight="700" text-anchor="start" xml:space="preserve">BENIGN ROWS</text><text x="800" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#8a91a0" font-weight="700" text-anchor="start" xml:space="preserve">SPLIT BY</text><text x="960" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#8a91a0" font-weight="700" text-anchor="start" xml:space="preserve">DEV / TEST</text><text x="1080" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#8a91a0" font-weight="700" text-anchor="start" xml:space="preserve">AS SHIPPED</text><text x="1170" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#8a91a0" font-weight="700" text-anchor="start" xml:space="preserve">TUNED THR.</text><text x="1260" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#8a91a0" font-weight="700" text-anchor="start" xml:space="preserve">AGENTAUDIT</text><text x="1350" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#8a91a0" font-weight="700" text-anchor="start" xml:space="preserve">PRECISION</text><text x="1430" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#8a91a0" font-weight="700" text-anchor="start" xml:space="preserve">OSS</text><line x1="28" y1="170" x2="1472" y2="170" stroke="#d9dde4" stroke-width="1"/><rect x="20" y="178" width="1460" height="50" rx="6" fill="#fafbfc" stroke="none" stroke-width="1"/><text x="28" y="202" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2430" font-weight="700" text-anchor="start" xml:space="preserve">Tool poisoning</text><text x="210" y="202" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2430" font-weight="400" text-anchor="start" xml:space="preserve">MCPTox poisoned descriptions (3 templates)</text><text x="520" y="202" font-family="-apple-system,BlinkMacSystemFont,'Segoe U