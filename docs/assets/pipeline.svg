<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a909c"/></marker></defs><rect width="1180" height="470" rx="16" fill="#fbfbfa" stroke="#e3e5ea"/><rect x="24" y="120" width="200" height="230" rx="10" fill="#ffffff" stroke="#c9ced8" stroke-width="1.4"/><text x="38" y="144" font-size="14" font-weight="700" fill="#0b0b0b">Agent</text><text x="38" y="164" font-size="12" fill="#52514e">MCP server repo</text><text x="38" y="181" font-size="12" fill="#52514e">agent skill (SKILL.md)</text><text x="38" y="198" font-size="12" fill="#52514e">manifest / Studio-style</text><text x="38" y="215" font-size="12" fill="#52514e">agent: role + MCP</text><text x="38" y="232" font-size="12" fill="#52514e">servers, overrides</text><text x="38" y="249" font-size="12" fill="#52514e"></text><text x="38" y="266" font-size="12" fill="#52514e">nothing is executed</text><line x1="226" y1="235" x2="262" y2="235" stroke="#8a909c" stroke-width="1.6" marker-end="url(#a)"/><rect x="266" y="28" width="300" height="126" rx="10" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.4"/><text x="280" y="52" font-size="14" font-weight="700" fill="#2a78d6">Safety</text><text x="280" y="72" font-size="12" fill="#52514e">Guard · injected instructions</text><text x="280" y="89" font-size="12" fill="#52514e">Inspect · scripts vs scope</text><text x="280" y="106" font-size="12" fill="#52514e">Protect · secrets, redaction</text><line x1="568" y1="91" x2="610" y2="235" stroke="#8a909c" stroke-width="1.6" marker-end="url(#a)"/><rect x="266" y="168" width="300" height="126" rx="10" fill="#fdf1ec" stroke="#eb6834" stroke-width="1.4"/><text x="280" y="192" font-size="14" font-weight="700" fill="#eb6834">Documents</text><text x="280" y="212" font-size="12" fill="#