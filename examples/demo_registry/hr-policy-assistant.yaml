# SYNTHETIC demo agent for the AgentAudit demo registry. Not a real product.
name: hr-policy-assistant
owner: People Operations (hr-platform@example-corp.com)
builder: a.khan
purpose: Answers employee questions about HR policies, leave balances and benefits from the approved policy library.
instructions: |
  You are the HR Policy Assistant. Answer only from the approved policy library.
  If a policy does not cover the question, say so and offer to open an HR case.
tools:
  - name: search_policies
    description: Searches the approved HR policy library and returns matching passages with document titles.
  - name: get_leave_balance
    description: Returns the requesting employee's current leave balance by leave type. Read-only.
  - name: open_hr_case
    description: Opens an HR case on behalf of the requesting employee with a short summary of their question.
readme: |
  HR Policy Assistant answers policy and leave questions for employees. It reads the policy library
  and the employee's own leave balance, and can open an HR case. It cannot change leave balances.
