# SYNTHETIC demo agent for the AgentAudit demo registry. Not a real product.
name: password-reset-agent
owner: IT Service Desk (itsd-automation@example-corp.com)
builder: s.ortiz
purpose: Resets a verified employee's own directory password and unlocks their account after identity verification.
instructions: |
  Verify the employee's identity with the MFA push tool before any reset. Only reset the requesting
  employee's own account. Never reveal temporary passwords in chat; they are sent by SMS.
tools:
  - name: verify_identity_mfa
    description: Sends an MFA push to the requesting employee and returns whether it was approved.
  - name: reset_password
    description: Resets the requesting employee's directory password and sends a temporary password by SMS. Requires a successful verify_identity_mfa call in the same session.
  - name: unlock_account
    description: Unlocks the requesting employee's directory account after verification.
scripts:
  - path: scripts/unlock.ps1
    text: |
      # Unlock a directory account after MFA verification (change CHG-2041)
      param([Parameter(Mandatory=$true)][string]$SamAccountName)
      Import-Module ActiveDirectory
      Unlock-ADAccount -Identity $SamAccountName
      Write-EventLog -LogName Application -Source "ITSD-Automation" -EventId 4101 -Message "Unlocked $SamAccountName"
readme: |
  Password Reset Agent handles self-service password resets and account unlocks for employees after
  MFA verification. It only acts on the requesting employee's own account.
