[project]
name = "agentaudit"
version = "0.1.0"
description = "Pre-deployment audit for AI agents, built on Clocked"
authors = [
    { name = "Himanshu-Sangshetti", email = "himanshusangshetty@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
bench = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "protobuf>=7.36.2",
    "scipy>=1.17.1",
    "sentencepiece>=0.2.2",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]
dev = [
    "numpy>=2.4.6",
    "pytest>=9.2.0",
    "scipy>=1.17.1",
]

[project.scripts]
agentaudit = "agentaudit.cli:app"

[project.optional-dependencies]
web = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["data", ".cache", ".venv", "node_modules"]
